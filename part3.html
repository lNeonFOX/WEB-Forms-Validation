<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part 3 - Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <a href="index.html">Back to index</a>
    <h1 class="h3 my-3">Part 3. Registration Form</h1>

    <div class="card">
      <div class="card-body">
        <h2 class="h5 mb-3">Task 4. Create an account</h2>
        <form action="#" method="post">
          <div class="row g-3">

            <div class="col-md-6">
              <label for="firstName" class="form-label">First name</label>
              <input type="text" class="form-control" id="firstName" name="firstName" required minlength="2" maxlength="30">
              <div class="form-text">Required, 2 to 30 characters.</div>
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Last name</label>
              <input type="text" class="form-control" id="lastName" name="lastName" required minlength="2" maxlength="30">
              <div class="form-text">Required, 2 to 30 characters.</div>
            </div>

            <div class="col-12">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
              <div class="form-text">Required, must be a valid email address.</div>
            </div>

            <div class="col-md-6">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required minlength="8">
              <div class="form-text">Required, minimum 8 characters.</div>
            </div>
            <div class="col-md-6">
              <label for="confirmPassword" class="form-label">Confirm password</label>
              <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="8">
              <div class="form-text">Re-enter the same password.</div>
            </div>

            <div class="col-md-6">
              <span class="form-label d-block mb-2">Gender</span>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                <label class="form-check-label" for="male">Male</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                <label class="form-check-label" for="female">Female</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="other" value="other" required>
                <label class="form-check-label" for="other">Other</label>
              </div>
            </div>

            <div class="col-md-6">
              <label for="country" class="form-label">Country</label>
              <select class="form-select" id="country" name="country" required>
                <option value="" selected disabled>Choose...</option>
                <option>Kazakhstan</option>
                <option>Uzbekistan</option>
                <option>Kyrgyzstan</option>
                <option>Turkey</option>
                <option>Germany</option>
                <option>United States</option>
              </select>
              <div class="form-text">Select your country.</div>
            </div>

            <div class="col-12">
              <span class="form-label d-block mb-2">Hobbies</span>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="hobbies" id="h1" value="reading">
                <label class="form-check-label" for="h1">Reading</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="hobbies" id="h2" value="sports">
                <label class="form-check-label" for="h2">Sports</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="hobbies" id="h3" value="music">
                <label class="form-check-label" for="h3">Music</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="hobbies" id="h4" value="coding">
                <label class="form-check-label" for="h4">Coding</label>
              </div>
            </div>

            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-primary">Submit</button>
              <button type="reset" class="btn btn-outline-secondary">Reset</button>
            </div>

          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
