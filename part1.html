<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part 1 - Basic HTML Forms</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; line-height: 1.5; }
    h2 { margin-top: 40px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font: inherit; }
    button { margin-top: 16px; padding: 8px 20px; font: inherit; cursor: pointer; }
    small { color: #555; }
  </style>
</head>
<body>
  <p><a href="index.html">&larr; Back to index</a></p>
  <h1>Part 1. Basic HTML Forms</h1>

  <h2>Task 0. Simple Contact Form</h2>
  <form action="#">
    <label for="name0">Name</label>
    <input type="text" id="name0" name="name">

    <label for="email0">Email</label>
    <input type="email" id="email0" name="email">

    <label for="message0">Message</label>
    <textarea id="message0" name="message" rows="5"></textarea>

    <button type="submit">Submit</button>
  </form>

  <h2>Task 1. Form with HTML5 Validation</h2>
  <form action="#">
    <label for="name1">Name</label>
    <input type="text" id="name1" name="name" required minlength="2" maxlength="50">
    <small>Required, 2 to 50 characters.</small>

    <label for="email1">Email</label>
    <input type="email" id="email1" name="email" required>
    <small>Required, must be a valid email format.</small>

    <label for="message1">Message</label>
    <textarea id="message1" name="message" rows="5" required minlength="10" maxlength="300"></textarea>
    <small>Required, 10 to 300 characters.</small>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
